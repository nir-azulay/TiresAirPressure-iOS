name: iOS TestFlight

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  # Build numbers are BUILD_NUMBER_BASE + the workflow run number. Raise the base
  # if you ever upload a higher build to TestFlight by hand.
  BUILD_NUMBER_BASE: "568"

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          
      - name: Compute build number
        run: echo "BUILD_NUMBER=$((BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Stage signing certificate & API key
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ]; then
            echo "::error::Secret IOS_DIST_CERT_P12_BASE64 is not set. See docs/ios-testflight-ci.md."
            exit 1
          fi
          if [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Secret ASC_KEY_P8_BASE64 is not set. See docs/ios-testflight-ci.md."
            exit 1
          fi
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "IOS_DIST_CERT_P12_PATH=$RUNNER_TEMP/distribution.p12" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane beta

      - name: Collect build logs
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp -R "$HOME/Library/Logs/gym" "$RUNNER_TEMP/logs/gym" 2>/dev/null || true
          cp "fastlane/report.xml" "$RUNNER_TEMP/logs/" 2>/dev/null || true

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14
          if-no-files-found: ignore
